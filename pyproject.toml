[project]
name = "aura-transcribe"
version = "0.1.0"
description = "Pipeline local de transcripcion con diarizacion y notas de Obsidian (WhisperX + pyannote + OpenRouter)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "whisperx==3.8.6",
]

[project.scripts]
aura-transcribe = "aura_transcribe.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_transcribe"]
